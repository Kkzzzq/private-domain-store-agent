name: Quality Agent Regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - backend/app/quality/**
      - backend/tests/test_quality*.py
      - web/op-quality.*
      - .github/workflows/quality-regression.yml

permissions:
  contents: read

jobs:
  isolated-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      MODEL_PROVIDER: cloud
      CLOUD_API_KEY: ""
      CLOUD_API_KEY_FILE: ""
      CLOUD_EMBEDDING_API_KEY_FILE: ""
      CLOUD_EMBEDDING_FALLBACK_MODELS: ""
      QA_NATIVE_ENABLED: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-e2e.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/test_quality.py tests/test_quality_business.py tests/test_quality_native.py tests/test_quality_reporting.py tests/test_quality_case_versions.py tests/test_embedding_failover.py -q
      - run: python scripts/check_quality.py --cases A01 A02 A03 A04 A07 A08 A09 A12 A13 A14 A29 A30 A38 A39 F01 F08 F29 --report data/acceptance/ci-quality-fixed.json
      - run: python scripts/check_quality.py --cases E01 E02 E03 E04 --report data/acceptance/ci-quality-browser.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-quality-evidence
          path: |
            backend/data/acceptance/ci-quality-*.json
            backend/data/quality-artifacts/*.png
          retention-days: 7
