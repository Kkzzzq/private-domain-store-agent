name: private-store-acceptance
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: private_store_acceptance
      MYSQL_USER: acceptance
      MYSQL_PASSWORD: acceptance-local-only
      MYSQL_ROOT_PASSWORD: acceptance-root-local-only
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --innodb-buffer-pool-size=128M
    ports:
      - "127.0.0.1:13306:3306"
    volumes:
      - acceptance-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pacceptance-root-local-only"]
      interval: 5s
      timeout: 3s
      retries: 40
  redis:
    image: redis:7
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - acceptance-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  ollama:
    image: ${ACCEPTANCE_OLLAMA_IMAGE:-ollama/ollama:latest}
    ports:
      - "127.0.0.1:11435:11434"
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - acceptance-ollama:/root/.ollama
  api:
    profiles: [api]
    build: .
    ports:
      - "127.0.0.1:18000:8000"
    environment:
      DATABASE_URL: mysql+pymysql://acceptance:acceptance-local-only@mysql:3306/private_store_acceptance?charset=utf8mb4
      REDIS_URL: redis://redis:6379/1
      JWT_SECRET: acceptance-only-secret-at-least-32-characters
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:1.5b
      OLLAMA_EMBED_MODEL: quentinz/bge-small-zh-v1.5
      OLLAMA_TIMEOUT_SECONDS: "120"
      OLLAMA_NUM_PREDICT: "512"
      OLLAMA_NUM_CTX: "4096"
      MODEL_PROVIDER: ollama
      AGENT_MODE: auto
      STRICT_DEPENDENCIES: "true"
      AGENT_REQUIRE_LLM: "true"
      RAG_REQUIRE_VECTORS: "true"
      ACCEPTANCE_ENVIRONMENT: "true"
      AGENT_RATE_LIMIT_PER_MINUTE: "120"
      CHROMA_COLLECTION: acceptance_knowledge_zh_v1
      CHROMA_PATH: /app/data/chroma
    volumes:
      - acceptance-api:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
volumes:
  acceptance-mysql:
  acceptance-redis:
  acceptance-ollama:
  acceptance-api:
