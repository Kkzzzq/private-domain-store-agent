<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>买家店铺 · 南枝手作</title>
  <link rel="stylesheet" href="/base.css">
</head>
<body>
  <header>
    <div>
      <p class="muted"><a href="/">返回</a></p>
      <h1 id="shop-name">店铺</h1>
      <p class="muted" id="shop-meta"></p>
    </div>
    <button class="ghost" id="reload">重新读取</button>
  </header>
  <main class="layout">
    <div class="stack">
      <section class="card" id="notice-card"></section>
      <section class="card stack" id="login-card">
        <h2>买家登录</h2>
        <label>账号<input id="username" value="alice"></label>
        <label>密码<input id="password" type="password" value="alice123"></label>
        <button id="login">登录后下单</button>
        <p class="error" id="login-error"></p>
      </section>
      <section>
        <h2>在售商品</h2>
        <div id="products" class="stack"></div>
      </section>
      <section>
        <h2>我在这家店的订单</h2>
        <div id="orders" class="stack"></div>
      </section>
    </div>
    <section class="card stack">
      <h2>店内助手</h2>
      <div id="chat" class="chat-log"></div>
      <form id="chat-form" class="stack">
        <textarea id="chat-text" placeholder="例如：雾蓝抱枕还有货吗 / 我的订单到哪了 / 定制品能退吗"></textarea>
        <button>发送</button>
      </form>
      <p class="error" id="chat-error"></p>
    </section>
  </main>
  <script src="/app.js"></script>
  <script>
    const api = createApi("token_c");
    const params = new URLSearchParams(location.search);
    const code = params.get("code") || "nanzhi";
    let sessionId = "";
    let shopStatus = "open";

    function addBubble(text, mine) {
      const node = document.createElement("div");
      node.className = mine ? "bubble me" : "bubble";
      node.textContent = text;
      document.querySelector("#chat").append(node);
    }

    async function loadShop() {
      const shop = await api(`/api/v1/c/shops/${code}`);
      shopStatus = shop.status;
      document.querySelector("#shop-name").textContent = shop.name;
      document.querySelector("#shop-meta").textContent = `${STATUS[shop.status]} · 分享码 ${shop.share_code}`;
      const notice = document.querySelector("#notice-card");
      notice.textContent = shop.notice || "商家还没有写公告。";
      const products = await api(`/api/v1/c/shops/${code}/products`);
      renderProducts(products);
      if (sessionStorage.getItem("token_c")) renderOrders(await api(`/api/v1/c/orders?share_code=${code}`));
    }

    function renderProducts(products) {
      const root = document.querySelector("#products");
      root.replaceChildren();
      if (!products.length) {
        const empty = document.createElement("p");
        empty.className = "muted";
        empty.textContent = shopStatus === "closed" ? "店铺已停业，暂时不能购买。" : "现在没有在售商品。";
        root.append(empty);
        return;
      }
      products.forEach((product) => {
        const card = document.createElement("article");
        card.className = "product";
        const title = document.createElement("strong");
        title.textContent = product.name;
        const desc = document.createElement("p");
        desc.className = "muted";
        desc.textContent = product.description;
        card.append(title, desc);
        product.skus.forEach((sku) => {
          const line = document.createElement("div");
          line.className = "sku";
          const text = document.createElement("span");
          text.textContent = `${sku.spec} · ${money(sku.price_yuan)} · 库存 ${sku.stock}`;
          const button = document.createElement("button");
          button.textContent = sku.purchasable ? "下单" : "不可购买";
          button.disabled = !sku.purchasable || !sessionStorage.getItem("token_c");
          button.addEventListener("click", () => placeOrder(sku.id));
          line.append(text, button);
          card.append(line);
        });
        root.append(card);
      });
    }

    async function renderOrders(orders) {
      const root = document.querySelector("#orders");
      root.replaceChildren();
      if (!orders.length) {
        const empty = document.createElement("p");
        empty.className = "muted";
        empty.textContent = "你在这家店还没有订单";
        root.append(empty);
        return;
      }
      orders.forEach((order) => {
        const card = document.createElement("article");
        card.className = "order";
        const title = document.createElement("div");
        title.className = "row";
        const no = document.createElement("strong");
        no.textContent = order.order_no;
        const badge = document.createElement("span");
        badge.className = `badge ${order.status}`;
        badge.textContent = order.status_label;
        title.append(no, badge);
        const meta = document.createElement("p");
        meta.textContent = `${money(order.total_yuan)} · ${order.address}`;
        const items = document.createElement("p");
        items.className = "muted";
        items.textContent = order.items.map((item) => `${item.product_name} ${item.sku_spec} x${item.quantity}`).join("，");
        card.append(title, meta, items);
        if (order.status === "pending") {
          const button = document.createElement("button");
          button.textContent = "支付";
          button.addEventListener("click", async () => {
            await api(`/api/v1/c/orders/${order.order_no}/pay`, { method: "POST" });
            await loadShop();
          });
          card.append(button);
        }
        root.append(card);
      });
    }

    async function placeOrder(skuId) {
      const address = window.prompt("收货地址", "长沙市岳麓区示范路 1 号");
      if (!address) return;
      await api(`/api/v1/c/shops/${code}/orders`, {
        method: "POST",
        body: JSON.stringify({ sku_id: skuId, quantity: 1, address }),
      });
      await loadShop();
    }

    document.querySelector("#login").addEventListener("click", async () => {
      const error = document.querySelector("#login-error");
      error.textContent = "";
      try {
        const data = await api("/api/v1/auth/login", {
          method: "POST",
          body: JSON.stringify({
            username: document.querySelector("#username").value,
            password: document.querySelector("#password").value,
          }),
        });
        sessionStorage.setItem("token_c", data.access_token);
        document.querySelector("#login-card").hidden = true;
        await loadShop();
      } catch (err) {
        error.textContent = err.message;
      }
    });

    document.querySelector("#reload").addEventListener("click", () => loadShop());
    document.querySelector("#chat-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const error = document.querySelector("#chat-error");
      error.textContent = "";
      const message = document.querySelector("#chat-text").value.trim();
      if (!message) return;
      addBubble(message, true);
      document.querySelector("#chat-text").value = "";
      try {
        const data = await api(`/api/v1/c/shops/${code}/chat`, {
          method: "POST",
          body: JSON.stringify({ message, session_id: sessionId || undefined }),
        });
        sessionId = data.session_id;
        addBubble(data.answer, false);
      } catch (err) {
        error.textContent = err.message;
      }
    });

    if (sessionStorage.getItem("token_c")) document.querySelector("#login-card").hidden = true;
    loadShop();
  </script>
</body>
</html>
