<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>商家后台 · 南枝手作</title>
  <link rel="stylesheet" href="/base.css">
</head>
<body>
  <header>
    <div>
      <p class="muted"><a href="/">返回</a></p>
      <h1>商家后台</h1>
    </div>
    <button class="ghost" id="logout" hidden>退出</button>
  </header>
  <main>
    <section class="card stack" id="login-card">
      <h2>登录</h2>
      <label>账号<input id="username" value="merchant"></label>
      <label>密码<input id="password" type="password" value="merchant123"></label>
      <button id="login">进入后台</button>
      <p class="error" id="login-error"></p>
    </section>
    <section id="desk" hidden class="stack">
      <section class="card stack">
        <h2>店铺</h2>
        <p>买家入口：<a id="share-link" href="/c.html?code=nanzhi">/c.html?code=nanzhi</a></p>
        <label>店名<input id="shop-name"></label>
        <label>公告<textarea id="shop-notice"></textarea></label>
        <label>营业状态
          <select id="shop-status">
            <option value="open">营业中</option>
            <option value="closed">停业</option>
          </select>
        </label>
        <button id="save-shop">保存店铺</button>
        <p class="error" id="shop-error"></p>
      </section>
      <section class="layout">
        <div class="stack">
          <h2>商品</h2>
          <div id="products" class="stack"></div>
          <form id="create-form" class="card stack">
            <h2>新建商品</h2>
            <p class="muted">新建后是下架，要上架买家才看得到。</p>
            <label>名称<input name="name" required></label>
            <label>规格<input name="spec" value="默认" required></label>
            <label>价格<input name="price" type="number" min="0.01" step="0.01" value="39" required></label>
            <label>库存<input name="stock" type="number" min="0" value="10" required></label>
            <button>创建</button>
          </form>
        </div>
        <div>
          <h2>本店订单</h2>
          <div id="orders" class="stack"></div>
        </div>
      </section>
    </section>
  </main>
  <script src="/app.js"></script>
  <script>
    const api = createApi("token_b");
    const loginCard = document.querySelector("#login-card");
    const desk = document.querySelector("#desk");
    const logout = document.querySelector("#logout");

    async function load() {
      const shop = await api("/api/v1/b/shop");
      document.querySelector("#shop-name").value = shop.name;
      document.querySelector("#shop-notice").value = shop.notice;
      document.querySelector("#shop-status").value = shop.status;
      const link = document.querySelector("#share-link");
      link.textContent = shop.share_path;
      link.href = shop.share_path;
      const products = await api("/api/v1/b/products");
      const orders = await api("/api/v1/b/orders");
      renderProducts(products);
      renderOrders(orders);
    }

    function renderProducts(products) {
      const root = document.querySelector("#products");
      root.replaceChildren();
      products.forEach((product) => {
        const card = document.createElement("article");
        card.className = "product";
        const title = document.createElement("div");
        title.className = "row";
        const name = document.createElement("strong");
        name.textContent = product.name;
        const badge = document.createElement("span");
        badge.className = `badge ${product.status}`;
        badge.textContent = STATUS[product.status] || product.status;
        title.append(name, badge);
        card.append(title);
        const actions = document.createElement("div");
        actions.className = "row";
        statusActions(product.status).forEach(([action, label]) => {
          const button = document.createElement("button");
          button.className = action === "ban" ? "warn" : "ghost";
          button.textContent = label;
          button.addEventListener("click", async () => {
            await api(`/api/v1/b/products/${product.id}/status`, { method: "POST", body: JSON.stringify({ action }) });
            await load();
          });
          actions.append(button);
        });
        card.append(actions);
        product.skus.forEach((sku) => {
          const line = document.createElement("div");
          line.className = "sku";
          const text = document.createElement("div");
          text.textContent = `${sku.spec} · ${money(sku.price_yuan)} · 库存 ${sku.stock} · ${STATUS[sku.status]}`;
          const buttons = document.createElement("div");
          buttons.className = "row";
          statusActions(sku.status).forEach(([action, label]) => {
            const button = document.createElement("button");
            button.className = "ghost";
            button.textContent = label;
            button.addEventListener("click", async () => {
              await api(`/api/v1/b/skus/${sku.id}/status`, { method: "POST", body: JSON.stringify({ action }) });
              await load();
            });
            buttons.append(button);
          });
          line.append(text, buttons);
          card.append(line);
        });
        root.append(card);
      });
    }

    function renderOrders(orders) {
      const root = document.querySelector("#orders");
      root.replaceChildren();
      if (!orders.length) {
        const empty = document.createElement("p");
        empty.className = "muted";
        empty.textContent = "还没有订单";
        root.append(empty);
        return;
      }
      orders.forEach((order) => {
        const card = document.createElement("article");
        card.className = "order";
        const title = document.createElement("div");
        title.className = "row";
        const no = document.createElement("strong");
        no.textContent = order.order_no;
        const badge = document.createElement("span");
        badge.className = `badge ${order.status}`;
        badge.textContent = order.status_label;
        title.append(no, badge);
        const meta = document.createElement("p");
        meta.textContent = `${order.buyer_nickname} · ${money(order.total_yuan)} · ${order.address}`;
        const items = document.createElement("p");
        items.className = "muted";
        items.textContent = order.items.map((item) => `${item.product_name} ${item.sku_spec} x${item.quantity}`).join("，");
        card.append(title, meta, items);
        if (order.status === "paid") {
          const button = document.createElement("button");
          button.textContent = "发货";
          button.addEventListener("click", async () => {
            await api(`/api/v1/b/orders/${order.order_no}/ship`, { method: "POST" });
            await load();
          });
          card.append(button);
        }
        root.append(card);
      });
    }

    document.querySelector("#login").addEventListener("click", async () => {
      const error = document.querySelector("#login-error");
      error.textContent = "";
      try {
        const data = await api("/api/v1/auth/login", {
          method: "POST",
          body: JSON.stringify({
            username: document.querySelector("#username").value,
            password: document.querySelector("#password").value,
          }),
        });
        sessionStorage.setItem("token_b", data.access_token);
        loginCard.hidden = true;
        desk.hidden = false;
        logout.hidden = false;
        await load();
      } catch (err) {
        error.textContent = err.message;
      }
    });

    document.querySelector("#save-shop").addEventListener("click", async () => {
      const error = document.querySelector("#shop-error");
      error.textContent = "";
      try {
        await api("/api/v1/b/shop", {
          method: "PATCH",
          body: JSON.stringify({
            name: document.querySelector("#shop-name").value,
            notice: document.querySelector("#shop-notice").value,
            status: document.querySelector("#shop-status").value,
          }),
        });
        await load();
      } catch (err) {
        error.textContent = err.message;
      }
    });

    document.querySelector("#create-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      await api("/api/v1/b/products", {
        method: "POST",
        body: JSON.stringify({
          name: form.name.value,
          skus: [{ spec: form.spec.value, price_yuan: Number(form.price.value), stock: Number(form.stock.value) }],
        }),
      });
      form.reset();
      await load();
    });

    logout.addEventListener("click", () => {
      sessionStorage.removeItem("token_b");
      location.reload();
    });

    if (sessionStorage.getItem("token_b")) {
      loginCard.hidden = true;
      desk.hidden = false;
      logout.hidden = false;
      load().catch(() => sessionStorage.removeItem("token_b"));
    }
  </script>
</body>
</html>
