<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>南枝手作 · 私域电商智能运营平台</title>
  <link rel="stylesheet" href="/mall.css">
</head>
<body>
  <header class="header">
    <div class="wrap">
      <div class="brand">
        <div class="mark">南</div>
        <div>
          <div class="name">南枝手作</div>
          <div class="sub">PRIVATE STORE AGENT</div>
        </div>
      </div>
      <div class="searchbox">
        <p class="muted">私域独立店铺。商家在后台改商品和库存，买家从分享码进店，两端读的是同一套数据。</p>
      </div>
    </div>
  </header>
  <main class="wrap" style="padding:8px 0 40px">
    <div class="grid" style="grid-template-columns:repeat(2,1fr);max-width:880px">
      <a class="pcard" href="/c.html?code=nanzhi">
        <div class="thumb"><img src="/covers/pillow.svg" alt="买家店铺"></div>
        <div class="body">
          <div class="title">买家店铺</div>
          <div class="meta"><span>分享码 nanzhi</span><span>alice / alice123</span></div>
          <div class="foot"><span class="muted">搜索 · 加购 · 下单 · 售后问答</span></div>
        </div>
      </a>
      <a class="pcard" href="/b.html">
        <div class="thumb"><img src="/covers/notebook.svg" alt="商家后台"></div>
        <div class="body">
          <div class="title">商家工作台</div>
          <div class="meta"><span>商家后台</span><span>merchant / merchant123</span></div>
          <div class="foot"><span class="muted">商品 · 库存 · 订单 · 店铺设置</span></div>
        </div>
      </a>
    </div>
  </main>
</body>
</html>
